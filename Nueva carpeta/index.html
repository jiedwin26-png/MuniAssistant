<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MuniAssistant</title>
  <link rel="icon" type="image/png" href="Muni2.ico.png" />

  <style>
    /* === ESTILOS GENERALES === */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #F9FAFB;
      color: #333;
    }

    /* === ENCABEZADO HERO === */
    header {
      position: relative;
      height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #002060, #4B4B4B, #002060);
      background-size: 600% 600%;
      animation: gradientBG 15s ease infinite;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .logo img {
      width: 320px;
      max-width: 90%;
      height: auto;
      opacity: 0;
      transform: scale(0.9);
      animation: fadeInZoom 1.5s ease forwards;
    }

    @keyframes fadeInZoom {
      0% {opacity: 0; transform: scale(0.9);}
      100% {opacity: 1; transform: scale(1);}
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.2em;
      padding: 12px 22px;
      border-radius: 10px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    nav a:hover {
      background-color: rgba(0, 48, 128, 0.8);
      transform: scale(1.05);
    }

    /* === CONTENIDO PRINCIPAL === */
    main {
      max-width: 900px;
      margin: 40px auto;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    section {
      margin-bottom: 30px;
      border-bottom: 1px solid #E5E7EB;
      padding-bottom: 20px;
    }

    h2 {
      background-color: #002060;
      color: white;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 0;
      font-size: 1.2em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.3s ease;
    }

    h2:hover { background-color: #003080; }

    .arrow { transition: transform 0.3s ease; }
    .arrow.open { transform: rotate(90deg); }

    .submenu {
      margin-top: 10px;
      margin-left: 20px;
      display: none;
    }

    .submenu a {
      display: block;
      margin: 8px 0;
      padding: 10px 15px;
      background-color: #F3F4F6;
      border-left: 5px solid #002060;
      border-radius: 6px;
      color: #002060;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .submenu a:hover {
      background-color: #E0E7FF;
    }

    /* === PIE DE PÁGINA === */
    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      color: #6B7280;
      font-size: 0.9em;
      background-color: #F3F4F6;
      border-top: 3px solid #002060;
    }

    footer a {
      color: #002060;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    footer a:hover { color: #4B4B4B; }

    @media (max-width: 600px) {
      .logo img { width: 220px; }
      nav a { font-size: 1em; padding: 8px 14px; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="Muni2.ico.png" alt="Logo Principal de MuniAssistant" />
    </div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="#">Servicios</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <main>
    <section>
      <h2 onclick="toggleMenu('generales', this)">
        Servicios Generales
        <span class="arrow">▶</span>
      </h2>
      <div id="generales" class="submenu">
        <a href="patente1.html">Patente 1</a>
        <a href="patente2.html">Patente 2</a>
        <a href="patente3.html">Patente 3</a>
        <a href="patente4.html">Patente 4</a>
      </div>
    </section>

    <section>
      <h2 onclick="toggleMenu('personalizados', this)">
        Servicios Personalizados
        <span class="arrow">▶</span>
      </h2>
      <div id="personalizados" class="submenu">
        <a href="#">Crear Solicitud</a>
        <a href="#">Ver Estado de Solicitud</a>
      </div>
    </section>
  </main>

  <footer>
    © 2025 MuniAssistant | Portal de Servicios Municipales |
    <a href="https://www.muniassistant.com" target="_blank" rel="noopener noreferrer">www.muniassistant.com</a>
  </footer>

  <script>
    function toggleMenu(id, element) {
      const menu = document.getElementById(id);
      const arrow = element.querySelector(".arrow");
      const isVisible = menu.style.display === "block";
      menu.style.display = isVisible ? "none" : "block";
      arrow.classList.toggle("open", !isVisible);
    }
  </script>
</body>
</html>
