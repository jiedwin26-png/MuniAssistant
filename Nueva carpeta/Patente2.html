<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patente 1 - MuniAssistant</title>
  <link rel="icon" type="image/png" href="Muni2.ico.png" />

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #F9FAFB;
      color: #333;
    }

    header {
      height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #002060, #4B4B4B, #002060);
      background-size: 600% 600%;
      animation: gradientBG 15s ease infinite;
      color: white;
      text-align: center;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .logo img {
      width: 200px;
      opacity: 0;
      transform: scale(0.9);
      animation: fadeInZoom 1.5s ease forwards;
    }

    @keyframes fadeInZoom {
      0% {opacity: 0; transform: scale(0.9);}
      100% {opacity: 1; transform: scale(1);}
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1em;
      padding: 10px 18px;
      border-radius: 8px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    nav a:hover {
      background-color: rgba(0, 48, 128, 0.8);
      transform: scale(1.05);
    }

    main {
      text-align: center;
      padding: 50px 20px;
      animation: fadeUp 1.2s ease forwards;
    }

    @keyframes fadeUp {
      0% {opacity: 0; transform: translateY(30px);}
      100% {opacity: 1; transform: translateY(0);}
    }

    h1 {
      color: #002060;
      font-size: 2.2em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1em;
      color: #555;
    }

    a.volver {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      color: white;
      background-color: #002060;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    a.volver:hover {
      background-color: #003080;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      color: #6B7280;
      font-size: 0.9em;
      background-color: #F3F4F6;
      border-top: 3px solid #002060;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="Muni2.ico.png" alt="Logo de MuniAssistant" />
    </div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="#">Servicios</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <main>
    <h1>Patente 2</h1>
    <p>Bienvenido a la sección de Patente 2.</p>
    <a class="volver" href="index.html">← Volver al inicio</a>
  </main>

  <footer>
    © 2025 MuniAssistant | Portal de Servicios Municipales
  </footer>

</body>
</html>
